name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle single-file player
        run: node tools/bundle.mjs

      - name: Assemble site
        run: |
          mkdir -p _site/examples _site/dist _site/docs _site/web
          cp -R web/. _site/
          cp -R web/. _site/web/
          cp dist/rigplayer.html _site/dist/rigplayer.html
          cp dist/rigplayer.html _site/rigplayer.html
          cp dist/rigplayer.html _site/web/rigplayer.html
          # Both pixel carts (*.rig) and scene/GLSL specimens (*.json).
          # Swallowing a missing glob hid demo-3d.json / demo-gleditor.json
          # from player.rig.works — ?src=examples/demo-3d.json 404'd.
          cp examples/*.rig _site/examples/
          cp examples/*.json _site/examples/
          mkdir -p _site/web/examples
          cp examples/*.rig _site/web/examples/
          cp examples/*.json _site/web/examples/
          test -f _site/examples/jailbreak.rig
          test -f _site/examples/demo-3d.json
          test -f _site/examples/demo-gleditor.json
          test -f _site/examples/portable-tool.json
          test -f _site/examples/ui-panel.json
          cp llms.txt _site/llms.txt
          cp docs/port-map.md docs/ai-share.md _site/docs/
          printf 'player.rig.works\n' > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
