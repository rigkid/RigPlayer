<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RigPlayer</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0d10;
			--panel: #14181f;
			--text: #e8ecf1;
			--muted: #9aa3ad;
			--accent: #4fa3ff;
			--border: #2a313c;
		}
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.4 system-ui, Segoe UI, sans-serif;
		}
		#app {
			display: grid;
			grid-template-rows: auto 1fr;
			width: 100%;
			height: 100%;
			min-width: 0;
			overflow: hidden;
		}
		html.embed #app { grid-template-rows: 1fr; }
		html.embed #app > header { display: none; }
		#app > header {
			display: flex;
			align-items: center;
			gap: 0.15rem;
			padding: 0.15rem 0.6rem;
			background: var(--panel);
			border-bottom: 1px solid var(--border);
			font-size: 13px;
			min-width: 0;
			max-width: 100%;
		}
		header h1 {
			display: flex;
			align-items: center;
			white-space: nowrap;
			flex: none;
			font-size: 13px;
			font-weight: 650;
			margin: 0 0.6rem 0 0;
			letter-spacing: 0.02em;
		}
		header h1::before {
			content: "";
			flex: none;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--accent);
			margin-right: 0.45rem;
		}
		header .meta {
			color: var(--muted);
			margin-left: auto;
			margin-right: 0.25rem;
			font-size: 12px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			min-width: 0;
		}
		details.menu { position: relative; }
		details.menu > summary {
			list-style: none;
			cursor: pointer;
			padding: 0.28rem 0.6rem;
			border-radius: 4px;
			user-select: none;
		}
		details.menu > summary::-webkit-details-marker { display: none; }
		details.menu > summary:hover, details.menu[open] > summary { background: #232b38; }
		.menu-items {
			position: absolute;
			top: calc(100% + 3px);
			left: 0;
			min-width: 200px;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.3rem;
			display: flex;
			flex-direction: column;
			z-index: 10;
			box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
		}
		.menu-item {
			appearance: none;
			display: block;
			width: 100%;
			text-align: left;
			background: none;
			border: none;
			color: var(--text);
			padding: 0.38rem 0.6rem;
			border-radius: 5px;
			cursor: pointer;
			font: inherit;
			font-size: 13px;
			text-decoration: none;
		}
		.menu-item:hover { background: #1d2c40; }
		.menu-item[aria-current="page"] { color: var(--accent); }
		.menu-sep { height: 1px; background: var(--border); margin: 0.25rem 0.2rem; }
		input[type="file"] { display: none; }
		#issues-toggle {
			appearance: none;
			background: none;
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--muted);
			font: inherit;
			font-size: 11.5px;
			padding: 0.15rem 0.5rem;
			cursor: pointer;
			margin-right: 0.4rem;
		}
		#issues-toggle:hover { border-color: var(--accent); color: var(--text); }
		#issues-toggle[data-level="error"] { color: #f0b4b4; border-color: #5a2828; }
		#issues-toggle[data-level="warn"] { color: #f0d9a8; border-color: #5a4a28; }
		.rig-panel {
			background: rgba(16, 19, 25, 0.85);
			backdrop-filter: blur(8px);
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 0.25rem 0.35rem 0.35rem;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
			resize: both;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		.rig-panel-head {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-bottom: 0.25rem;
			cursor: grab;
			user-select: none;
			touch-action: none;
			font-size: 12px;
			flex-shrink: 0;
		}
		.rig-panel-head:active { cursor: grabbing; }
		.rig-panel-head > strong { margin-right: auto; font-weight: 600; }
		.rig-caret { color: var(--muted); font-size: 9px; transition: transform 0.12s ease; }
		.rig-panel.collapsed .rig-caret { transform: rotate(-90deg); }
		.rig-panel.collapsed .rig-panel-body { display: none; }
		.rig-panel.collapsed {
			resize: none;
			overflow: hidden;
			height: auto !important;
			min-height: 0;
			padding-bottom: 0.3rem;
		}
		.rig-panel.collapsed .rig-panel-head { margin-bottom: 0; }
		.rig-panel-role { color: var(--muted); font-size: 10.5px; margin-right: 0.2rem; }
		.rig-x {
			appearance: none;
			background: none;
			border: none;
			color: var(--muted);
			font-size: 14px;
			line-height: 1;
			padding: 0 0.15rem;
			cursor: pointer;
			order: 10;
		}
		.rig-x:hover { color: var(--text); }
		.rig-panel-body {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			flex: 1 1 auto;
			min-height: 0;
			overflow: auto;
		}
		#issues-panel {
			position: absolute;
			bottom: 42px;
			left: 10px;
			z-index: 6;
			width: min(420px, calc(100% - 20px));
			max-height: min(50%, calc(100% - 24px));
		}
		.rig-issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
		.rig-issue {
			margin: 0;
			padding: 0.35rem 0.45rem;
			border-left: 2px solid var(--border);
			font-size: 12px;
			line-height: 1.35;
			color: var(--text);
		}
		.rig-issue[data-level="error"] { border-color: #c06060; background: rgba(80, 24, 24, 0.35); }
		.rig-issue[data-level="warn"] { border-color: #c0a050; background: rgba(70, 56, 16, 0.3); }
		.rig-issue[data-level="note"] { border-color: var(--border); color: var(--muted); }
		.rig-issue-code {
			display: inline-block;
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			margin-right: 0.35rem;
		}
		.rig-issue-hint { display: block; margin-top: 0.2rem; color: var(--muted); font-size: 11px; }
		#stage {
			position: relative;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			display: grid;
			place-items: center;
			background: #050608;
		}
		#stage.drag {
			outline: 2px dashed var(--accent);
			outline-offset: -8px;
		}
		canvas#view {
			width: min(100%, calc(100dvh - 2.5rem));
			height: min(100%, 100vw);
			max-width: 100%;
			max-height: 100%;
			aspect-ratio: 1;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			background: #000;
			touch-action: none;
		}
		#share-banner {
			position: absolute;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 5;
			max-width: min(80%, 640px);
			align-items: center;
			gap: 0.6rem;
			padding: 0.35rem 0.7rem;
			font-size: 12.5px;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: rgba(26, 34, 45, 0.85);
			backdrop-filter: blur(8px);
			box-shadow: 0 4px 14px rgba(0,0,0,0.3);
			color: var(--muted);
		}
		#share-banner:not([hidden]) { display: flex; }
		#share-banner span { flex: 1; min-width: 0; }
		.banner-close {
			appearance: none;
			background: none;
			border: none;
			color: inherit;
			font-size: 15px;
			line-height: 1;
			padding: 0 0.2rem;
			cursor: pointer;
			opacity: 0.7;
		}
		.banner-close:hover { opacity: 1; }
		#share-banner[data-level="soft"] { color: #f0d9a8; border-color: #5a4a28; background: rgba(42, 36, 20, 0.88); }
		#share-banner[data-level="hard"] { color: #f0b4b4; border-color: #5a2828; background: rgba(42, 20, 20, 0.88); }
		#empty {
			position: absolute;
			inset: 0;
			display: none;
			place-items: center;
			text-align: center;
			color: var(--muted);
			pointer-events: none;
			padding: 1.5rem;
		}
		#empty:not([hidden]) { display: grid; }
		#empty code { color: var(--text); }
		#overlay {
			position: absolute;
			left: 10px;
			bottom: 10px;
			right: 10px;
			max-height: 30%;
			overflow: auto;
			font-size: 12px;
			color: #f0d9a8;
			background: rgba(20, 16, 8, 0.85);
			border: 1px solid #5a4a28;
			border-radius: 6px;
			padding: 0.45rem 0.6rem;
			display: none;
			z-index: 4;
		}
		#controls-hint {
			position: absolute;
			right: 10px;
			bottom: 10px;
			font-size: 11px;
			color: var(--muted);
			background: rgba(16, 19, 25, 0.7);
			border: 1px solid var(--border);
			border-radius: 5px;
			padding: 0.25rem 0.45rem;
			z-index: 3;
			pointer-events: none;
		}
		@media (max-width: 640px) {
			#app > header {
				flex-wrap: wrap;
				row-gap: 0.1rem;
				padding: 0.2rem 0.4rem;
			}
			header .meta {
				order: 10;
				flex: 1 0 100%;
				margin: 0;
				font-size: 11px;
			}
			.menu-items {
				position: fixed;
				left: 8px;
				right: 8px;
				top: 2.75rem;
				min-width: 0;
				width: auto;
				max-height: min(70vh, 420px);
				overflow: auto;
				z-index: 50;
			}
			#controls-hint { display: none; }
		}
	</style>
	<script>
		(function () {
			var e = new URLSearchParams(location.search).get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
		})();
	</script>
</head>
<body>

	<div id="app">
		<header>
			<h1>RigPlayer</h1>
			<details class="menu" id="menu-file">
				<summary>File</summary>
				<div class="menu-items">
					<label class="menu-item">Open…<input id="file" type="file" accept=".json,.rig,application/json" /></label>
					<button type="button" class="menu-item" id="btn-copy-link" title="Copy a ?doc= link for small carts">Copy link</button>
					<button type="button" class="menu-item" id="btn-save-local" title="Save current document in this browser">Save local</button>
					<button type="button" class="menu-item" id="btn-restore-local" hidden title="Restore last local cart">Restore local</button>
					<div class="menu-sep"></div>
					<a class="menu-item" id="download-single" href="#" title="Self-contained offline copy">Single-file HTML</a>
				</div>
			</details>
			<details class="menu" id="menu-examples">
				<summary>Examples</summary>
				<div class="menu-items">
					<a class="menu-item" href="?src=examples/jailbreak.rig">Jailbreak</a>
				</div>
			</details>
			<button type="button" id="issues-toggle" hidden title="Show validator issues"></button>
			<span class="meta" id="status">Drop a Rig document, or File → Open</span>
		</header>
		<div id="stage">
			<canvas id="view" width="128" height="128"></canvas>
			<div id="share-banner" hidden data-level=""></div>
			<div id="empty" hidden>
				<div>
					<p>Drop a <code>.rig</code> / <code>.json</code> here, or use <strong>File → Open</strong>.</p>
					<p>Viewer presents; Player plays.</p>
				</div>
			</div>
			<section id="issues-panel" class="rig-panel" hidden>
				<header class="rig-panel-head" id="issues-head">
					<span class="rig-caret">▾</span>
					<strong>Issues</strong>
					<span class="rig-panel-role" id="issues-role">validator</span>
				</header>
				<div class="rig-panel-body">
					<ul class="rig-issues" id="issues-list"></ul>
				</div>
			</section>
			<div id="overlay"></div>
			<div id="controls-hint">Arrows move · Z/C O · X/V X</div>
		</div>
	</div>

<script type="module">

globalThis.__RIGPLAYER_EXAMPLES__ = {"examples/jailbreak.rig":"{\n  \"rig\": \"0.4.0\",\n  \"document\": {\n    \"title\": \"jailbreak\",\n    \"defaultUnit\": \"px\"\n  },\n  \"entities\": [\n    {\n      \"id\": \"console\",\n      \"components\": {\n        \"rig.meta.named\": {\n          \"name\": \"console\",\n          \"stableId\": \"console\"\n        },\n        \"rig.pixel.canvas\": {\n          \"width\": 128,\n          \"height\": 128,\n          \"clearRgba\": [\n            0,\n            0,\n            0,\n            1\n          ]\n        }\n      }\n    },\n    {\n      \"id\": \"palette\",\n      \"components\": {\n        \"rig.meta.named\": {\n          \"name\": \"palette\",\n          \"stableId\": \"palette\"\n        },\n        \"rig.pixel.palette\": {\n          \"colors\": [\n            [\n              0,\n              0,\n              0,\n              1\n            ],\n            [\n              0.114,\n              0.169,\n              0.325,\n              1\n            ],\n            [\n              0.494,\n              0.145,\n              0.325,\n              1\n            ],\n            [\n              0,\n              0.529,\n              0.318,\n              1\n            ],\n            [\n              0.671,\n              0.322,\n              0.212,\n              1\n            ],\n            [\n              0.373,\n              0.341,\n              0.31,\n              1\n            ],\n            [\n              0.761,\n              0.765,\n              0.78,\n              1\n            ],\n            [\n              1,\n              0.945,\n              0.91,\n              1\n            ],\n            [\n              1,\n              0,\n              0.302,\n              1\n            ],\n            [\n              1,\n              0.639,\n              0,\n              1\n            ],\n            [\n              1,\n              0.925,\n              0.153,\n              1\n            ],\n            [\n              0,\n              0.894,\n              0.212,\n              1\n            ],\n            [\n              0.161,\n              0.678,\n              1,\n              1\n            ],\n            [\n              0.514,\n              0.463,\n              0.612,\n              1\n            ],\n            [\n              1,\n              0.467,\n              0.659,\n              1\n            ],\n            [\n              1,\n              0.8,\n              0.667,\n              1\n            ]\n          ]\n        }\n      }\n    },\n    {\n      \"id\": \"cart-code\",\n      \"components\": {\n        \"rig.meta.named\": {\n          \"name\": \"cart-code\",\n          \"stableId\": \"cart-code\"\n        },\n        \"rig.media.code\": {\n          \"text\": \"-- jail break\\n-- port of 2325_PiArcadeGames/JailBreak (led-wall arcade)\\n-- authored as a Rig document -> rig-to-p8\\n-- escape campaign: cell -> jail -> tunnels -> yard ->\\n-- woods -> river -> village -> park -> city/market -> woods -> home\\n\\n-- spr map (build-jailbreak-sprites.py)\\n-- tiles: jail 1/2, dirt 3/4, fence 5/6, tree 7/8, house 9/10, exit 11, water 12, shelf 13, stone 14\\n-- man dn 16/17 up 18/19 side 20/21, skull 22, wife 23, heart 24\\n-- unarmed side 25/26, dog 27/28, booth 29, bench 30, can 31\\n-- police car 32 (2x2 tiles, nose right), pistol 34, shotgun 35, key 36\\n-- title band sheet y=72 128x56\\n\\n--<rules>\\nplayerhp=3\\nspeed=1\\nbspd=3\\nblife=16\\npunchc=18\\npunchr=7\\nbars=3\\nrounds=12\\nshells=8\\njumpt=8\\njspd=2\\nsinkt=6\\n--</rules>\\nncols={{8,2},{11,3},{12,1}}  -- suit/dark per player\\n-- companion: orange suit via pal(8,9)\\n\\n-- solid -> cracked -> gone; 0 means the next hit clears the tile\\ncrack=split(\\\"2,0,4,0,6,0,8,0,10\\\")\\ndustc=split(\\\"6,5,4,4,6,6,11,3,4,4\\\")\\n-- tiles you can stand on: floor, doorway, water (lethal), stepping stone\\npass={[0]=1,[11]=1,[12]=1,[14]=1}\\n\\nfunction wrap(v)\\n return (v%128+128)%128\\nend\\n\\nfunction tdelta(a,b)\\n local d=a-b\\n if d>64 then d-=128 end\\n if d<-64 then d+=128 end\\n return d\\nend\\n\\nfunction tile(px,py)\\n return mget(flr(wrap(px)/8),flr(wrap(py)/8))\\nend\\n\\nfunction solid(px,py)\\n return not pass[tile(px,py)]\\nend\\n\\nfunction wet(px,py)\\n return tile(px,py)==12\\nend\\n\\n-- land=1 keeps a walker out of the water; players may wade in and drown\\nfunction blocked(x,y,land)\\n for dx=1,6,5 do\\n  for dy=1,6,5 do\\n   if solid(x+dx,y+dy) or (land and wet(x+dx,y+dy)) then return true end\\n  end\\n end\\n return false\\nend\\n\\ndirs={{1,0},{-1,0},{0,1},{0,-1}}\\n\\nfunction anykey()\\n return btnp(4) or btnp(5)\\nend\\n\\n-- everything a guard, a bullet or a dog is willing to hurt\\nfunction victims()\\n local t={}\\n for p in all(ps) do\\n  if p.alive then add(t,p) end\\n end\\n if buddy and buddy.alive and not buddy.locked then add(t,buddy) end\\n return t\\nend\\n\\nfunction norm(x,y)\\n local l=sqrt(x*x+y*y)\\n if l<0.01 then return 0,1 end\\n return x/l,y/l\\nend\\n\\n-->8 level generators\\n\\nfunction mclear(t)\\n t=t or 0\\n for x=0,15 do\\n  for y=0,15 do\\n   mset(x,y,t)\\n  end\\n end\\nend\\n\\nfunction bord(t)\\n for i=0,15 do\\n  mset(i,0,t) mset(i,15,t)\\n  mset(0,i,t) mset(15,i,t)\\n end\\nend\\n\\n-- n random tiles of type t sprinkled inside the border\\nfunction scatter(n,t)\\n for i=1,n do\\n  mset(1+flr(rnd(14)),1+flr(rnd(14)),t)\\n end\\nend\\n\\nfunction box(x1,y1,x2,y2,t)\\n for x=x1,x2 do mset(x,y1,t) mset(x,y2,t) end\\n for y=y1,y2 do mset(x1,y,t) mset(x2,y,t) end\\nend\\n\\nfunction place_exit()\\n exy=3+flr(rnd(10))\\n mset(15,exy,11)\\n mset(14,exy,0)\\nend\\n\\nfunction clear_spawn()\\n for dx=0,1 do\\n  for dy=0,2 do\\n   -- never clear a door: spawns often sit right beside one\\n   if mget(sx+dx,sy+dy)!=11 then\\n    mset(sx+dx,sy+dy,0)\\n   end\\n  end\\n end\\nend\\n\\nfunction gen_cell()\\n mclear() bord(1)\\n box(2,5,6,10,1)\\n for i=1,4 do\\n  local x,y=8+flr(rnd(6)),2+flr(rnd(11))\\n  mset(x,y,1) mset(x,y+1,1)\\n end\\n sx,sy=3,6\\n place_exit()\\nend\\n\\nfunction gen_doc()\\n for x=0,15 do\\n  for y=0,15 do\\n   mset(x,y,orig[x][y])\\n  end\\n end\\n sx,sy=1,1\\n place_exit()\\n -- sealed cell for the orange prisoner (freed on this level)\\n box(9,5,12,8,1)\\n mset(10,6,0) mset(11,6,0) mset(10,7,0) mset(11,7,0)\\n buddy_cell={10,6}\\nend\\n\\nfunction gen_jail()\\n mclear() bord(1)\\n for cx=2,10,4 do\\n  for cy=2,10,4 do\\n   if rnd(1)<0.8 then\\n    box(cx,cy,cx+3,cy+3,1)\\n    local d=flr(rnd(4))\\n    if d==0 then mset(cx+1+flr(rnd(2)),cy,0)\\n    elseif d==1 then mset(cx+1+flr(rnd(2)),cy+3,0)\\n    elseif d==2 then mset(cx,cy+1+flr(rnd(2)),0)\\n    else mset(cx+3,cy+1+flr(rnd(2)),0) end\\n   end\\n  end\\n end\\n sx,sy=1,1\\n place_exit()\\nend\\n\\nfunction gen_tunnel()\\n mclear(3)\\n local x,y=1,3+flr(rnd(10))\\n sx,sy=1,y-1\\n mset(x,y,0)\\n while x<15 do\\n  local r=rnd(1)\\n  if r<0.5 then x+=1\\n  elseif r<0.75 then y=mid(1,13,y-1)\\n  else y=mid(1,13,y+1) end\\n  mset(x,y,0)\\n  mset(x,y+1,0)\\n end\\n exy=y\\n mset(15,y,11)\\n for i=1,3 do\\n  local px,py=2+flr(rnd(12)),1+flr(rnd(12))\\n  mset(px,py,0) mset(px+1,py,0)\\n end\\nend\\n\\nfunction gen_fence()\\n mclear()\\n for i=0,15 do\\n  mset(0,i,1)\\n  mset(i,0,5) mset(i,15,5)\\n end\\n for y=1,14 do mset(11,y,5) end\\n for i=1,8 do\\n  mset(2+flr(rnd(8)),1+flr(rnd(13)),1)\\n end\\n sx,sy=1,6\\n place_exit()\\nend\\n\\nfunction gen_forest()\\n mclear()\\n bord(7)\\n scatter(42,7)\\n sx,sy=1,6\\n place_exit()\\nend\\n\\n-- river: water band with stepping stones; dogs can't swim, so they lose you\\nfunction gen_river()\\n mclear()\\n for x=0,15 do\\n  for y=0,15 do\\n   if x==0 or y==0 or y==15 then mset(x,y,7)\\n   elseif x>=6 and x<=9 then mset(x,y,12)\\n   elseif rnd(1)<0.15 then mset(x,y,7) end\\n  end\\n end\\n -- stones sit exactly one jump apart, so the crossing is hop-hop-hop\\n local py=3+flr(rnd(9))\\n for x=1,14 do\\n  if x<6 or x>9 then mset(x,py,0) end\\n end\\n mset(7,py,14)\\n mset(9,py,14)\\n sx,sy=1,py\\n place_exit()\\nend\\n\\nfunction gen_village()\\n mclear()\\n for i=0,15 do mset(i,0,7) mset(i,15,7) end\\n for gx=0,1 do\\n  for gy=0,1 do\\n   if rnd(1)<0.9 then\\n    local hx=4+gx*6+flr(rnd(2))\\n    local hy=2+gy*6+flr(rnd(2))\\n    box(hx,hy,hx+3,hy+2,9)\\n    mset(hx+1+flr(rnd(2)),hy+2,0)\\n   end\\n  end\\n end\\n sx,sy=1,6\\n place_exit()\\nend\\n\\nfunction gen_park()\\n mclear()\\n decor={}\\n hides={}\\n bord(7)\\n scatter(20,7)\\n -- crossed paths through the trees, with a bench in each quarter\\n for y=2,13 do mset(7,y,0) mset(8,y,0) end\\n for x=2,13 do mset(x,7,0) mset(x,8,0) end\\n for i=0,3 do\\n  add(decor,{x=24+(i%2)*64,y=40+flr(i/2)*40,s=30})\\n end\\n sx,sy=1,7\\n place_exit()\\nend\\n\\nfunction city_building(hx,hy,bw,bh)\\n box(hx,hy,hx+bw-1,hy+bh-1,9)\\n for x=hx+1,hx+bw-2 do\\n  for y=hy+1,hy+bh-2 do\\n   mset(x,y,0)\\n   add(hides,{x=x*8,y=y*8,kind=2})\\n  end\\n end\\n local dx=hx+1+flr(rnd(max(1,bw-2)))\\n mset(dx,hy+bh-1,0)\\nend\\n\\nfunction gen_city()\\n mclear()\\n hides={}\\n decor={}\\n bord(9)\\n for x=1,14 do\\n  for y=3,4 do mset(x,y,0) end\\n  for y=10,11 do mset(x,y,0) end\\n end\\n for y=1,14 do\\n  mset(1,y,0) mset(2,y,0)\\n  mset(13,y,0) mset(14,y,0)\\n end\\n city_building(4,1,4,2)\\n city_building(9,1,4,2)\\n city_building(4,6,4,3)\\n city_building(9,6,4,3)\\n city_building(4,13,5,2)\\n -- supermarket doorway (walk in)\\n market_door={x=80,y=96}\\n add(decor,{x=market_door.x,y=market_door.y,s=29})\\n -- phone booths\\n for b in all({{24,32},{96,80},{40,80}}) do\\n  add(decor,{x=b[1],y=b[2],s=29})\\n  add(hides,{x=b[1],y=b[2],kind=1})\\n end\\n sx,sy=1,3\\n place_exit()\\n -- roads are 2 tiles tall: rows 3-4 (y=24) and 10-11 (y=80)\\n car_spawns={{x=16,y=24,vx=1},{x=96,y=80,vx=-1}}\\nend\\n\\nfunction gen_market()\\n mclear()\\n hides={}\\n decor={}\\n market_door=nil\\n bord(9)\\n for ay=2,12,3 do\\n  for x=2,6 do mset(x,ay,13) end\\n  for x=9,13 do mset(x,ay,13) end\\n end\\n for y=1,14 do\\n  mset(7,y,0) mset(8,y,0)\\n  mset(1,y,0) mset(14,y,0)\\n end\\n for x=1,14 do mset(x,14,0) end\\n cans={}\\n -- two per open aisle row, well clear of the shelves\\n for i=0,5 do\\n  add(cans,{x=(3+(i%2)*7)*8,y=(3+flr(i/2)*3)*8,got=false})\\n end\\n cans_need=3\\n cans_got=0\\n -- the cleared middle column is the checkout lane out to the doors\\n sx,sy=7,11\\n exy=15\\n mset(7,15,11) mset(8,15,11)\\nend\\n\\nfunction gen_home()\\n mclear()\\n bord(7)\\n scatter(22,7)\\n box(6,5,10,9,9)\\n mset(8,9,0)\\n for x=7,9 do\\n  for y=6,8 do\\n   mset(x,y,0)\\n  end\\n end\\n wifex,wifey=64,48\\n sx,sy=1,12\\n exy=nil\\nend\\n\\n-- the campaign, held as parallel arrays: names, generators, clear colour,\\n-- guard count, dog count, then sparse per-level flags.\\nlname=split(\\\"the cell,cell block a,cell block b,the tunnel,deep tunnel,the yard,the woods,the river,the village,the park,the city,dark woods,home\\\")\\nlgen={gen_cell,gen_doc,gen_jail,gen_tunnel,gen_tunnel,gen_fence,gen_forest,gen_river,gen_village,gen_park,gen_city,gen_forest,gen_home}\\nlbg=split(\\\"0,0,0,0,0,3,3,1,5,3,5,3,3\\\")\\nlng=split(\\\"1,2,2,1,2,2,2,1,2,1,0,2,1\\\")\\nlnd=split(\\\"0,0,0,0,0,2,3,3,0,0,0,0,0\\\")\\nlkey={[3]=1,[9]=1}   -- a guard here carries the door key\\nllight={[6]=1}       -- searchlight sweeps the yard\\nlwet={[8]=1}         -- cross here and the dogs are gone\\nlsup={[11]=1}        -- need supplies before you can move on\\nlcar={[11]=2}        -- police cruisers on patrol\\n\\n-->8 game state\\n\\nfunction _init()\\n frm=0\\n mode=\\\"title\\\"\\n nplayers=1\\n buddy=nil\\n dogs_gone=false\\n supplies_got=false\\n in_market=false\\n hides={}\\n decor={}\\n cars={}\\n cans={}\\n drops={}\\n hits={}\\n chase={}\\n score=0\\n has_key=false\\n has_photo=false\\n lspot=nil\\n market_door=nil\\n car_spawns={}\\n cartdata(\\\"rig_jailbreak\\\")\\n hi=dget(0)\\n orig={}\\n for tx=0,15 do\\n  orig[tx]={}\\n  for ty=0,15 do\\n   orig[tx][ty]=mget(tx,ty)\\n  end\\n end\\nend\\n\\nfunction free_spot()\\n for try=1,200 do\\n  local x,y=flr(rnd(120)),flr(rnd(120))\\n  if not blocked(x,y,1) then\\n   local ok=true\\n   for p in all(ps) do\\n    if abs(tdelta(p.x,x))<24 and abs(tdelta(p.y,y))<24 then ok=false end\\n   end\\n   if buddy and buddy.alive and abs(tdelta(buddy.x,x))<20 and abs(tdelta(buddy.y,y))<20 then\\n    ok=false\\n   end\\n   if ok then return x,y end\\n  end\\n end\\n return 60,60\\nend\\n\\n-- both crowds are capped so a long chain of pursuits stays survivable\\nfunction add_guard(w,c)\\n if #guards>=4 then return end\\n local x,y=free_spot()\\n add(guards,{\\n  x=x,y=y,hp=2,w=w,\\n  dx=0,dy=1,vx=0,vy=0,\\n  flash=0,cool=c,seed=flr(rnd(60))\\n })\\nend\\n\\nfunction add_dog(c)\\n if #dogs>=4 then return end\\n local x,y=free_spot()\\n add(dogs,{\\n  x=x,y=y,hp=1,\\n  dx=1,dy=0,vx=0,vy=0,\\n  cool=c,seed=flr(rnd(40)),flash=0\\n })\\nend\\n\\nfunction spawn_buddy_locked()\\n buddy={\\n  x=buddy_cell[1]*8,y=buddy_cell[2]*8,\\n  dx=0,dy=1,hp=playerhp,\\n  alive=true,locked=true,freed=false,\\n  flash=0,dead_t=0\\n }\\nend\\n\\nfunction load_level(i)\\n wifex=nil\\n buddy_cell=nil\\n hides={}\\n decor={}\\n cars={}\\n cans={}\\n market_door=nil\\n car_spawns={}\\n in_market=false\\n lgen[i]()\\n clear_spawn()\\n for k,p in pairs(ps) do\\n  p.x=sx*8\\n  p.y=(sy+(k-1))*8\\n  p.hp=playerhp\\n  p.alive=true\\n  p.out=false\\n  p.dead_t=0\\n  p.flash=0\\n  p.cool=0\\n  p.dx,p.dy=1,0\\n  p.hiding=false\\n  p.fist=0\\n  p.jz=0\\n  p.sink=0\\n  p.jvx,p.jvy=0,0\\n  -- you start with nothing but your hands, and keep what you took\\n  p.wep=p.wep or 0\\n  p.ammo=p.ammo or 0\\n end\\n\\n -- companion: lock in on cell block a, otherwise carry forward if alive\\n if i==2 and (not buddy or not buddy.freed) then\\n  spawn_buddy_locked()\\n elseif buddy and buddy.freed then\\n  if revive_buddy or buddy.alive then\\n   if revive_buddy then\\n    buddy.alive=true\\n    buddy.hp=playerhp\\n    buddy.dead_t=0\\n    revive_buddy=false\\n   end\\n   if buddy.alive then\\n    buddy.x=sx*8+8\\n    buddy.y=sy*8\\n    buddy.flash=0\\n    buddy.dx,buddy.dy=1,0\\n    buddy.hiding=false\\n    buddy.jz=0\\n   end\\n  end\\n end\\n\\n guards={}\\n dogs={}\\n -- everyone past the wire carries a shotgun\\n for g=1,lng[i] do add_guard(i>=6 and 2 or 1,30) end\\n -- one of them is holding the door key\\n if lkey[i] and guards[1] then guards[1].key=true end\\n if not dogs_gone then\\n  for d=1,lnd[i] do add_dog(0) end\\n end\\n\\n -- whoever was on your heels at the last door comes through it\\n local followed=#chase\\n for c in all(chase) do\\n  if c.k==1 then add_guard(c.w,45) else add_dog(30) end\\n end\\n chase={}\\n\\n drops={}\\n hits={}\\n has_key=false\\n -- her photo is taped up inside your own cell\\n if i==1 and not has_photo then\\n  add(drops,{x=sx*8+16,y=sy*8+8,w=4})\\n end\\n -- yard searchlight sweeps the compound\\n lspot=llight[i] and {a=rnd(1)} or nil\\n\\n cars={}\\n local nc=lcar[i] or 0\\n for c in all(car_spawns) do\\n  if nc>0 then\\n   add(cars,{\\n    x=c.x,y=c.y,vx=c.vx,vy=0,\\n    dx=c.vx,dy=0,flash=0\\n   })\\n   nc-=1\\n  end\\n end\\n\\n bullets={}\\n dust={}\\n toast=followed>0 and \\\"they followed you!\\\" or nil\\n toast_t=toast and 60 or 0\\n go_t=20\\n sfx(5)\\nend\\n\\nfunction load_market()\\n in_market=true\\n market_from=lvl\\n gen_market()\\n clear_spawn()\\n for k,p in pairs(ps) do\\n  if p.alive then\\n   p.x=sx*8\\n   p.y=sy*8+(k-1)*8\\n   p.cool=0\\n   p.hiding=false\\n  end\\n end\\n if buddy and buddy.alive then\\n  buddy.x=sx*8+8\\n  buddy.y=sy*8\\n  buddy.hiding=false\\n end\\n guards={}\\n dogs={}\\n cars={}\\n bullets={}\\n dust={}\\n toast=\\\"grab 3 supplies!\\\"\\n toast_t=90\\n go_t=10\\n sfx(5)\\nend\\n\\nfunction leave_market()\\n supplies_got=true\\n in_market=false\\n local doorx,doory=80,96\\n load_level(market_from)\\n for k,p in pairs(ps) do\\n  if p.alive then\\n   p.x=doorx-10\\n   p.y=doory+(k-1)*8\\n  end\\n end\\n if buddy and buddy.alive then\\n  buddy.x=doorx-18\\n  buddy.y=doory\\n end\\n toast=\\\"got supplies!\\\"\\n toast_t=60\\nend\\n\\nfunction start_game()\\n ps={}\\n for i=1,nplayers do\\n  ps[i]={id=i-1}\\n end\\n buddy=nil\\n dogs_gone=false\\n supplies_got=false\\n in_market=false\\n revive_buddy=false\\n cans_got=0\\n score=0\\n has_photo=false\\n chase={}\\n lvl=1\\n load_level(1)\\n music(0)\\n mode=\\\"play\\\"\\nend\\n\\n-->8 update\\n\\nfunction hurt(e,n)\\n e.hp-=n\\n e.flash=6\\n sfx(2)\\n blood(e.x+4,e.y+4,8)\\n if e.hp<=0 then\\n  e.alive=false\\n  e.dead_t=0\\n  sfx(3)\\n end\\nend\\n\\n-- a dead guard leaves what he was carrying\\nfunction drop_wep(g)\\n add(drops,{x=g.x,y=g.y,w=g.w})\\n if g.key then add(drops,{x=wrap(g.x+6),y=g.y,w=3}) end\\nend\\n\\nfunction kill_guard(g,pts)\\n del(guards,g)\\n drop_wep(g)\\n score+=pts\\n sfx(3)\\nend\\n\\n-- bare hands: cracks masonry, and kills outright from behind\\nfunction punch(p)\\n p.cool=punchc\\n p.fist=8\\n sfx(6)\\n local mx,my=norm(p.dx,p.dy)\\n local hx,hy=wrap(p.x+4+mx*punchr),wrap(p.y+4+my*punchr)\\n local tx,ty=flr(hx/8),flr(hy/8)\\n local t=mget(tx,ty)\\n if not pass[t] then\\n  local k=tx+ty*16\\n  hits[k]=(hits[k] or 0)+1\\n  if hits[k]>=bars then\\n   hits[k]=0\\n   mset(tx,ty,crack[t] or 0)\\n  end\\n  blood(hx,hy,3,dustc[t] or 6)\\n  return\\n end\\n for g in all(guards) do\\n  if abs(tdelta(g.x+4,hx))<6 and abs(tdelta(g.y+4,hy))<6 then\\n   -- punching the way he faces means you came up behind him\\n   if mx*g.dx+my*g.dy>0 then\\n    blood(hx,hy,10)\\n    kill_guard(g,250)\\n    toast=\\\"silent kill!\\\"\\n    toast_t=40\\n   else\\n    blood(hx,hy,4)\\n    g.hp-=1\\n    g.flash=6\\n    g.cool=0\\n    sfx(2)\\n    if g.hp<=0 then kill_guard(g,100) end\\n   end\\n   return\\n  end\\n end\\n for d in all(dogs) do\\n  if abs(tdelta(d.x+4,hx))<6 and abs(tdelta(d.y+4,hy))<6 then\\n   del(dogs,d)\\n   blood(hx,hy,4)\\n   score+=50\\n   sfx(3)\\n   return\\n  end\\n end\\nend\\n\\nfunction attack(p)\\n if p.wep==0 then\\n  punch(p)\\n  return\\n end\\n local mx,my=norm(p.dx,p.dy)\\n local n=p.wep==2 and 3 or 1\\n for i=1,n do\\n  -- perpendicular offset fans the shotgun pellets out\\n  local s=(i-2)*0.14\\n  add(bullets,{\\n   x=p.x+4,y=p.y+4,\\n   vx=(mx-my*s)*bspd,vy=(my+mx*s)*bspd,\\n   owner=p.id,life=p.wep==2 and 10 or blife\\n  })\\n end\\n p.ammo-=1\\n p.cool=p.wep==2 and 22 or 6\\n if p.ammo<=0 then\\n  p.wep=0\\n  toast=\\\"out of ammo\\\"\\n  toast_t=40\\n end\\n sfx(1)\\nend\\n\\nfunction update_player(p)\\n if not p.alive then\\n  p.dead_t+=1\\n  if p.dead_t>60 then p.out=true end\\n  return\\n end\\n\\n local l,r=btn(0,p.id),btn(1,p.id)\\n local u,d=btn(2,p.id),btn(3,p.id)\\n\\n local vx=(r and speed or 0)-(l and speed or 0)\\n local vy=(d and speed or 0)-(u and speed or 0)\\n\\n if vx!=0 or vy!=0 then\\n  p.dx,p.dy=vx,vy\\n end\\n\\n if btnp(5,p.id) and p.jz<=0 then\\n  local mx,my=norm(p.dx,p.dy)\\n  p.jz=jumpt\\n  p.jvx,p.jvy=mx*jspd,my*jspd\\n  sfx(7)\\n end\\n\\n -- airborne: carry the hop, clearing water but not walls\\n if p.jz>0 then\\n  p.jz-=1\\n  vx,vy=p.jvx,p.jvy\\n end\\n\\n local nx=wrap(p.x+vx)\\n if not blocked(nx,p.y) and not bump(p,nx,p.y) then p.x=nx end\\n local ny=wrap(p.y+vy)\\n if not blocked(p.x,ny) and not bump(p,p.x,ny) then p.y=ny end\\n\\n if p.cool>0 then p.cool-=1 end\\n if p.flash>0 then p.flash-=1 end\\n if p.fist>0 then p.fist-=1 end\\n\\n -- a moment of flailing before you go under: long enough to hop clear\\n if p.jz<=0 and wet(p.x+4,p.y+4) then\\n  p.sink+=1\\n  if frm%4==0 then blood(p.x+4,p.y+4,2,12) end\\n  if p.sink>sinkt then\\n   blood(p.x+4,p.y+4,10,12)\\n   p.alive=false\\n   p.hp=0\\n   p.dead_t=0\\n   toast=\\\"drowned!\\\"\\n   toast_t=60\\n   sfx(3)\\n   return\\n  end\\n else\\n  p.sink=0\\n end\\n\\n if btn(4,p.id) and p.cool<=0 then attack(p) end\\n\\n -- weapons, keys and keepsakes left on the floor\\n for k in all(drops) do\\n  if abs(tdelta(p.x,k.x))<7 and abs(tdelta(p.y,k.y))<7 then\\n   del(drops,k)\\n   if k.w==3 then\\n    has_key=true\\n    toast=\\\"got the key!\\\"\\n   elseif k.w==4 then\\n    has_photo=true\\n    toast=\\\"her photo\\\"\\n   else\\n    p.wep=k.w\\n    p.ammo=k.w==2 and shells or rounds\\n    toast=k.w==2 and \\\"shotgun!\\\" or \\\"pistol!\\\"\\n   end\\n   toast_t=40\\n   sfx(5)\\n  end\\n end\\n\\n -- free the locked companion by standing next to the cell\\n if buddy and buddy.locked and buddy.alive then\\n  if abs(tdelta(p.x,buddy.x))<16 and abs(tdelta(p.y,buddy.y))<16 then\\n   buddy.locked=false\\n   buddy.freed=true\\n   toast=\\\"prisoner freed!\\\"\\n   toast_t=60\\n   sfx(5)\\n  end\\n end\\n\\n -- hide in phone booths / building interiors\\n p.hiding=is_hiding(p)\\n\\n -- supermarket doorway in the city\\n if market_door and not in_market and not supplies_got and\\n    abs(tdelta(p.x,market_door.x))<8 and abs(tdelta(p.y,market_door.y))<8 then\\n  load_market()\\n  return\\n end\\n\\n -- pick up supply cans\\n if in_market and cans then\\n  for c in all(cans) do\\n   if not c.got and abs(tdelta(p.x,c.x))<6 and abs(tdelta(p.y,c.y))<6 then\\n    c.got=true\\n    cans_got+=1\\n    score+=25\\n    toast=\\\"supplies \\\"..cans_got..\\\"/\\\"..cans_need\\n    toast_t=40\\n    sfx(5)\\n   end\\n  end\\n end\\n\\n if exy and mget(flr(wrap(p.x+4)/8),flr(wrap(p.y+4)/8))==11 then\\n  if in_market then\\n   if cans_got>=cans_need then\\n    leave_market()\\n   else\\n    toast=\\\"need \\\"..(cans_need-cans_got)..\\\" more\\\"\\n    toast_t=40\\n   end\\n  else\\n   try_next_level()\\n  end\\n end\\n\\n if wifex and abs(tdelta(p.x,wifex))<7 and abs(tdelta(p.y,wifey))<7 then\\n  mode=\\\"won\\\"\\n  win_t=0\\n  score+=1000\\n  if has_photo then score+=500 end\\n  if buddy and buddy.alive then score+=2000 end\\n  save_hi()\\n  music(-1)\\n  sfx(4)\\n end\\nend\\n\\nfunction save_hi()\\n if score>hi then\\n  hi=score\\n  dset(0,hi)\\n end\\nend\\n\\n-- the yard searchlight: caught in the beam and you are back inside\\nfunction update_spot()\\n lspot.a+=0.0035\\n lspot.x=64+cos(lspot.a)*40\\n lspot.y=64+sin(lspot.a*1.7)*40\\n for p in all(ps) do\\n  if p.alive and not p.hiding and\\n     abs(tdelta(p.x+4,lspot.x))<9 and abs(tdelta(p.y+4,lspot.y))<9 then\\n   busted()\\n   return\\n  end\\n end\\nend\\n\\nfunction is_hiding(e)\\n if not hides then return false end\\n for h in all(hides) do\\n  if abs(tdelta(e.x,h.x))<7 and abs(tdelta(e.y,h.y))<7 then\\n   return true\\n  end\\n end\\n return false\\nend\\n\\nfunction try_next_level()\\n if lsup[lvl] and not supplies_got then\\n  toast=\\\"need supplies first\\\"\\n  toast_t=60\\n  return\\n end\\n if lkey[lvl] and not has_key then\\n  toast=\\\"the door is locked\\\"\\n  toast_t=60\\n  return\\n end\\n next_level()\\nend\\n\\nfunction next_level()\\n -- leave him locked in his cell if you didn't free him\\n if buddy and buddy.locked then buddy=nil end\\n score+=500\\n -- anything still alive and close to the door gives chase\\n chase={}\\n local lose=lwet[lvl]\\n if not lose then\\n  for d in all(dogs) do add(chase,{k=2}) end\\n end\\n local n=0\\n for g in all(guards) do\\n  if n<2 and abs(tdelta(g.x,120))<32 then\\n   add(chase,{k=1,w=g.w})\\n   n+=1\\n  end\\n end\\n if lose then dogs_gone=true end\\n lvl+=1\\n load_level(lvl)\\n -- announced after the load, which sets its own arrival toast\\n if lose then\\n  toast=\\\"lost the dogs!\\\"\\n  toast_t=60\\n end\\nend\\n\\nfunction busted()\\n mode=\\\"over\\\"\\n win_t=0\\n save_hi()\\n music(-1)\\n toast=\\\"busted!\\\"\\n toast_t=60\\n sfx(3)\\nend\\n\\n-- clear line of sight along a row/column (no solid tiles between)\\nfunction los_clear(x0,y0,x1,y1)\\n local dx=tdelta(x1,x0)\\n local dy=tdelta(y1,y0)\\n local steps=max(1,flr(max(abs(dx),abs(dy))/4))\\n for i=1,steps do\\n  local t=i/steps\\n  local x=x0+dx*t\\n  local y=y0+dy*t\\n  if solid(x,y) then return false end\\n end\\n return true\\nend\\n\\nfunction car_sees(c,e)\\n if not e or not e.alive or e.hiding then return false end\\n -- only spot along the road the car is on, ahead of the nose\\n if abs(tdelta(e.y+4,c.y+8))>12 then return false end\\n local nose=c.vx>0 and c.x+15 or c.x\\n local ahead=tdelta(e.x+4,nose)*c.vx\\n if ahead<4 or ahead>56 then return false end\\n return los_clear(nose,c.y+8,e.x+4,e.y+4)\\nend\\n\\n-- the cruiser is 16x16; test its body corners, not a walker's box\\nfunction car_blocked(x,y)\\n return solid(x+2,y+5) or solid(x+13,y+5)\\n     or solid(x+2,y+10) or solid(x+13,y+10)\\nend\\n\\nfunction update_car(c)\\n local nx=wrap(c.x+c.vx)\\n if car_blocked(nx,c.y) then\\n  c.vx=-c.vx\\n  c.dx=c.vx\\n else\\n  c.x=nx\\n end\\n -- turn around before sliding off the road\\n if c.x<4 or c.x>108 then\\n  c.vx=-c.vx\\n  c.dx=c.vx\\n  c.x=mid(4,108,c.x)\\n end\\n for p in all(ps) do\\n  if car_sees(c,p) then busted() return end\\n end\\n if buddy and buddy.alive then\\n  buddy.hiding=is_hiding(buddy)\\n  if car_sees(c,buddy) then busted() return end\\n end\\nend\\n\\nfunction bump(p,x,y)\\n for o in all(ps) do\\n  if o!=p and o.alive and\\n     abs(tdelta(o.x,x))<7 and abs(tdelta(o.y,y))<7 then\\n   return true\\n  end\\n end\\n if buddy and buddy.alive and not buddy.locked and\\n    abs(tdelta(buddy.x,x))<7 and abs(tdelta(buddy.y,y))<7 then\\n  return true\\n end\\n return false\\nend\\n\\n-- tile walkable for companion pathfinding (empty / exit)\\nfunction buddy_tile_ok(tx,ty)\\n local t=mget(tx%16,ty%16)\\n return t==0 or t==11 or t==14\\nend\\n\\n-- BFS on the 16x16 map; returns pixel target of the next tile toward (px,py)\\nfunction buddy_next_step(px,py)\\n local sx,sy=flr(buddy.x/8),flr(buddy.y/8)\\n local gx,gy=flr(px/8),flr(py/8)\\n if sx==gx and sy==gy then\\n  return px,py\\n end\\n\\n local q,seen,prev={},{},{}\\n local function id(x,y) return (x%16)+((y%16)*16) end\\n q[1]={sx,sy}\\n seen[id(sx,sy)]=true\\n local head,found=1,false\\n\\n while head<=#q and not found do\\n  local c=q[head]\\n  head+=1\\n  for d in all(dirs) do\\n   local x,y=(c[1]+d[1])%16,(c[2]+d[2])%16\\n   local k=id(x,y)\\n   if not seen[k] and buddy_tile_ok(x,y) then\\n    seen[k]=true\\n    prev[k]=c\\n    add(q,{x,y})\\n    if x==gx and y==gy then found=true break end\\n   end\\n  end\\n end\\n if not found then return nil end\\n\\n -- walk back until the step right after the start tile\\n local cx,cy=gx,gy\\n for _=1,32 do\\n  local p=prev[id(cx,cy)]\\n  if not p then return nil end\\n  if p[1]==sx and p[2]==sy then\\n   -- inset so the 6x6 body clears walls\\n   return cx*8+1,cy*8+1\\n  end\\n  cx,cy=p[1],p[2]\\n end\\n return nil\\nend\\n\\nfunction buddy_try(vx,vy)\\n if vx==0 and vy==0 then return false end\\n local mx=wrap(buddy.x+vx)\\n local my=wrap(buddy.y+vy)\\n -- prefer full step, then axis slide (same feel as the player)\\n if not blocked(mx,my,1) then\\n  buddy.x,buddy.y=mx,my\\n  if vx!=0 then buddy.dx=vx end\\n  if vy!=0 then buddy.dy=vy end\\n  return true\\n end\\n if vx!=0 and not blocked(mx,buddy.y,1) then\\n  buddy.x=mx\\n  buddy.dx=vx\\n  return true\\n end\\n if vy!=0 and not blocked(buddy.x,my,1) then\\n  buddy.y=my\\n  buddy.dy=vy\\n  return true\\n end\\n return false\\nend\\n\\nfunction update_buddy()\\n if not buddy or not buddy.alive then\\n  if buddy then buddy.dead_t=(buddy.dead_t or 0)+1 end\\n  return\\n end\\n if buddy.locked then return end\\n if buddy.flash>0 then buddy.flash-=1 end\\n\\n -- mid-hop: he ignores water underneath but still bumps into walls\\n if (buddy.jz or 0)>0 then\\n  buddy.jz-=1\\n  local hx,hy=wrap(buddy.x+buddy.jvx),wrap(buddy.y+buddy.jvy)\\n  if not blocked(hx,buddy.y) then buddy.x=hx end\\n  if not blocked(buddy.x,hy) then buddy.y=hy end\\n  return\\n end\\n\\n local lead=ps[1]\\n if not lead or not lead.alive then\\n  for p in all(ps) do\\n   if p.alive then lead=p break end\\n  end\\n end\\n if not lead then return end\\n\\n local dx,dy=tdelta(lead.x,buddy.x),tdelta(lead.y,buddy.y)\\n -- keep a little gap so he doesn't sit on the player\\n if abs(dx)<=8 and abs(dy)<=8 then\\n  buddy.stuck=0\\n  return\\n end\\n\\n local tx,ty=buddy_next_step(lead.x,lead.y)\\n local vx,vy=0,0\\n if tx then\\n  local ddx,ddy=tdelta(tx,buddy.x),tdelta(ty,buddy.y)\\n  vx=ddx>0 and 1 or ddx<0 and -1 or 0\\n  vy=ddy>0 and 1 or ddy<0 and -1 or 0\\n else\\n  -- no tile path: greedily lean toward the leader\\n  vx=dx>2 and 1 or dx<-2 and -1 or 0\\n  vy=dy>2 and 1 or dy<-2 and -1 or 0\\n end\\n\\n -- longer axis first, then the other, then diagonal\\n local moved=false\\n if abs(dx)>=abs(dy) then\\n  moved=buddy_try(vx,0) or buddy_try(0,vy) or buddy_try(vx,vy)\\n else\\n  moved=buddy_try(0,vy) or buddy_try(vx,0) or buddy_try(vx,vy)\\n end\\n\\n if not moved then\\n  -- hug the wall: sweep the perpendiculars, alternating which way first\\n  buddy.stuck=(buddy.stuck or 0)+1\\n  local f=buddy.stuck%2==0 and 1 or -1\\n  moved=buddy_try(0,f) or buddy_try(0,-f)\\n     or buddy_try(f,0) or buddy_try(-f,0)\\n else\\n  buddy.stuck=0\\n end\\n\\n -- he can't swim: hop stone to stone, and hop out again if he lands short\\n if not moved or wet(buddy.x+4,buddy.y+4) then\\n  local hx,hy=norm(dx,dy)\\n  if wet(buddy.x+4,buddy.y+4) or wet(buddy.x+4+hx*8,buddy.y+4+hy*8) then\\n   buddy.jz=jumpt\\n   buddy.jvx,buddy.jvy=hx*jspd,hy*jspd\\n   buddy.stuck=0\\n   return\\n  end\\n end\\n\\n -- last resort: if jammed for ~1s, snap to the next open tile toward lead\\n if not moved and (buddy.stuck or 0)>40 then\\n  local nx,ny=buddy_next_step(lead.x,lead.y)\\n  if nx and not blocked(nx,ny,1) then\\n   buddy.x,buddy.y=nx,ny\\n   buddy.stuck=0\\n  end\\n end\\nend\\n\\nfunction update_guard(g)\\n if g.flash>0 then g.flash-=1 end\\n if (frm+g.seed)%12==0 then\\n  -- index 0 falls off the end of dirs, which is how he stands still\\n  local d=dirs[flr(rnd(5))]\\n  g.vx,g.vy=d and d[1] or 0,d and d[2] or 0\\n  if d then g.dx,g.dy=g.vx,g.vy end\\n end\\n local nx=wrap(g.x+g.vx)\\n if not blocked(nx,g.y,1) then g.x=nx end\\n local ny=wrap(g.y+g.vy)\\n if not blocked(g.x,ny,1) then g.y=ny end\\n\\n if g.cool>0 then g.cool-=1 return end\\n -- shoot at escapees or the companion\\n for t in all(victims()) do\\n  local dx,dy=tdelta(t.x,g.x),tdelta(t.y,g.y)\\n  if abs(dx)<5 and abs(dy)<64 then\\n   g.dx,g.dy=0,dy>0 and 1 or -1\\n   gshoot(g,0,dy>0 and bspd or -bspd)\\n   break\\n  elseif abs(dy)<5 and abs(dx)<64 then\\n   g.dx,g.dy=dx>0 and 1 or -1,0\\n   gshoot(g,dx>0 and bspd or -bspd,0)\\n   break\\n  end\\n end\\nend\\n\\n-- outside guards carry shotguns: three pellets, short range, slow to recover\\nfunction gshoot(g,vx,vy)\\n for i=1,g.w==2 and 3 or 1 do\\n  local s=(i-2)*0.5\\n  add(bullets,{\\n   x=g.x+4,y=g.y+4,\\n   vx=vx-vy*s,vy=vy+vx*s,\\n   owner=-1,life=g.w==2 and 11 or blife\\n  })\\n end\\n g.cool=(g.w==2 and 45 or 30)+flr(rnd(30))\\n sfx(1)\\nend\\n\\nfunction nearest_prey(from)\\n local best,bd=nil,9999\\n for p in all(ps) do\\n  if p.alive then\\n   local d=abs(tdelta(p.x,from.x))+abs(tdelta(p.y,from.y))\\n   if d<bd then best,bd=p,d end\\n  end\\n end\\n if buddy and buddy.alive and not buddy.locked then\\n  local d=abs(tdelta(buddy.x,from.x))+abs(tdelta(buddy.y,from.y))\\n  if d<bd then best=buddy end\\n end\\n return best\\nend\\n\\nfunction update_dog(d)\\n if d.flash>0 then d.flash-=1 end\\n local prey=nearest_prey(d)\\n if prey then\\n  local dx,dy=tdelta(prey.x,d.x),tdelta(prey.y,d.y)\\n  -- dogs run a bit faster than walking pace\\n  local vx=(dx>2 and 1 or dx<-2 and -1 or 0)\\n  local vy=(dy>2 and 1 or dy<-2 and -1 or 0)\\n  if (frm+d.seed)%2==0 then\\n   if vx!=0 or vy!=0 then d.dx,d.dy=vx,vy end\\n   local nx=wrap(d.x+vx)\\n   if not blocked(nx,d.y,1) then d.x=nx end\\n   local ny=wrap(d.y+vy)\\n   if not blocked(d.x,ny,1) then d.y=ny end\\n  end\\n  -- bite on contact\\n  if d.cool>0 then d.cool-=1\\n  elseif abs(tdelta(prey.x,d.x))<7 and abs(tdelta(prey.y,d.y))<7 then\\n   if prey.alive then hurt(prey,1) end\\n   d.cool=24\\n  end\\n end\\nend\\n\\nfunction hit_wall(b)\\n local tx,ty=flr(wrap(b.x)/8),flr(wrap(b.y)/8)\\n local t=mget(tx,ty)\\n if pass[t] then return false end\\n mset(tx,ty,crack[t] or 0)\\n blood(b.x,b.y,6,dustc[t] or 6)\\n return true\\nend\\n\\nfunction blood(x,y,n,c)\\n for i=1,n do\\n  add(dust,{\\n   x=x,y=y,\\n   vx=rnd(2.4)-1.2,vy=rnd(2.4)-1.2,\\n   c=c or 8,life=12+rnd(10)\\n  })\\n end\\nend\\n\\nfunction update_bullets()\\n for b in all(bullets) do\\n  b.x=wrap(b.x+b.vx)\\n  b.y=wrap(b.y+b.vy)\\n  b.life-=1\\n  if b.life<=0 or hit_wall(b) then\\n   del(bullets,b)\\n  elseif b.owner==-1 then\\n   for t in all(victims()) do\\n    if abs(tdelta(t.x+4,b.x))<4 and abs(tdelta(t.y+4,b.y))<4 then\\n     del(bullets,b)\\n     hurt(t,1)\\n     break\\n    end\\n   end\\n  else\\n   local hit=false\\n   for g in all(guards) do\\n    if abs(tdelta(g.x+4,b.x))<4 and abs(tdelta(g.y+4,b.y))<4 then\\n     del(bullets,b)\\n     g.hp-=1\\n     g.flash=6\\n     sfx(2)\\n     blood(b.x,b.y,6)\\n     if g.hp<=0 then kill_guard(g,100) end\\n     hit=true\\n     break\\n    end\\n   end\\n   if not hit then\\n    for d in all(dogs) do\\n     if abs(tdelta(d.x+4,b.x))<5 and abs(tdelta(d.y+4,b.y))<5 then\\n      del(bullets,b)\\n      del(dogs,d)\\n      sfx(3)\\n      blood(b.x,b.y,4)\\n      score+=50\\n      break\\n     end\\n    end\\n   end\\n  end\\n end\\nend\\n\\nfunction update_dust()\\n for d in all(dust) do\\n  d.x+=d.vx d.y+=d.vy\\n  d.life-=1\\n  if d.life<=0 then del(dust,d) end\\n end\\nend\\n\\nfunction _update()\\n frm+=1\\n if mode==\\\"title\\\" then\\n  if btnp(0) or btnp(1) then\\n   nplayers=mid(1,3,nplayers+(btnp(1) and 1 or -1))\\n  end\\n  if anykey() then start_game() end\\n  return\\n end\\n\\n if mode==\\\"won\\\" then\\n  win_t+=1\\n  if win_t>90 and anykey() then mode=\\\"title\\\" end\\n  return\\n end\\n\\n if mode==\\\"over\\\" then\\n  win_t+=1\\n  if win_t>30 and anykey() then\\n   revive_buddy=true\\n   load_level(lvl)\\n   mode=\\\"play\\\"\\n  end\\n  return\\n end\\n\\n if go_t>0 then go_t-=1 return end\\n if toast_t>0 then toast_t-=1 end\\n\\n
