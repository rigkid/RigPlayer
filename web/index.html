<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>RigPlayer</title>
	<meta name="description" content="Plays a Rig document — the document is the chrome." />
	<script>
		(function () {
			var q = new URLSearchParams(location.search);
			var e = q.get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
			var edit = q.get("edit");
			if (edit === "1" || edit === "true") document.documentElement.classList.add("edit");
			else if (!document.documentElement.classList.contains("embed"))
				document.documentElement.classList.add("doc");
		})();
	</script>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: #0b0d10;
			color: #e8ecf1;
			font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
		}
		#app {
			position: relative;
			width: 100%;
			height: 100%;
		}
		canvas#tui {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 2;
			touch-action: none;
		}
		canvas#view {
			position: absolute;
			z-index: 3;
			display: block;
			background: #050608;
			touch-action: none;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}
		html.doc canvas#view,
		html.embed canvas#view {
			inset: 0;
			width: 100%;
			height: 100%;
		}
		html.doc canvas#tui {
			z-index: 5;
			pointer-events: none;
		}
		html.embed canvas#tui { display: none; }
		html.embed .host,
		html.embed #empty,
		html.embed #note { display: none !important; }
		html.edit .host,
		html.edit #empty { display: none !important; }
		#code-host {
			position: absolute;
			z-index: 3;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.92);
			border: 1px solid #2a313c;
		}
		html.doc #code-host { z-index: 6; }
		.host {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			z-index: 8;
			display: flex;
			align-items: center;
			gap: 0.45rem;
			padding: 0.45rem 0.65rem;
			background: linear-gradient(to bottom, rgba(11, 13, 16, 0.92), rgba(11, 13, 16, 0));
			pointer-events: none;
		}
		.host > * { pointer-events: auto; }
		.host .brand {
			color: #4fa3ff;
			font-size: 0.78rem;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			margin-right: 0.35rem;
			text-decoration: none;
		}
		.host button,
		.host select,
		.host a.ghost {
			appearance: none;
			border: 1px solid #2a313c;
			background: rgba(13, 16, 21, 0.85);
			color: #e8ecf1;
			font: inherit;
			font-size: 0.78rem;
			padding: 0.28rem 0.55rem;
			border-radius: 4px;
			cursor: pointer;
			text-decoration: none;
		}
		.host button:hover,
		.host select:hover,
		.host a.ghost:hover {
			border-color: #4fa3ff;
			color: #fff;
		}
		.host select { max-width: 9.5rem; }
		.host .spacer { flex: 1; }
		#note {
			position: absolute;
			left: 0.65rem;
			right: 0.65rem;
			bottom: 0.65rem;
			z-index: 8;
			padding: 0.45rem 0.65rem;
			border: 1px solid #2a313c;
			border-radius: 4px;
			background: rgba(13, 16, 21, 0.92);
			font-size: 0.78rem;
			color: #c9d2dc;
		}
		#note.warn { border-color: #b8892d; color: #f0d090; }
		#note.err { border-color: #c44; color: #f88; }
		#empty {
			position: absolute;
			inset: 0;
			z-index: 7;
			display: grid;
			place-content: center;
			gap: 0.75rem;
			text-align: center;
			background: #0b0d10;
			padding: 2rem;
		}
		#empty[hidden] { display: none !important; }
		#empty p {
			margin: 0;
			color: #8b95a1;
			font-size: 0.95rem;
		}
		#empty .hint {
			font-size: 0.78rem;
			color: #5c6570;
		}
		#boot {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #0b0d10;
			z-index: 10;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			font-size: 12px;
			color: #888;
		}
		#boot[hidden] { display: none !important; }
		#boot.error {
			color: #f66;
			padding: 2rem;
			text-align: center;
			white-space: pre-wrap;
			text-transform: none;
			letter-spacing: 0;
		}
		input[type="file"] { display: none; }
		#pad {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 6;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
			padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
			pointer-events: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
		}
		#pad-dpad {
			position: relative;
			width: clamp(88px, 26vmin, 136px);
			height: clamp(88px, 26vmin, 136px);
			border-radius: 50%;
			border: 1px solid rgba(232, 236, 241, 0.25);
			background: rgba(13, 16, 21, 0.55);
			pointer-events: auto;
			touch-action: none;
		}
		#pad-dpad .pad-arrow {
			position: absolute;
			color: rgba(232, 236, 241, 0.6);
			font-size: 16px;
			pointer-events: none;
		}
		.pad-up { top: 8px; left: 50%; transform: translateX(-50%); }
		.pad-down { bottom: 8px; left: 50%; transform: translateX(-50%); }
		.pad-left { left: 12px; top: 50%; transform: translateY(-50%); }
		.pad-right { right: 12px; top: 50%; transform: translateY(-50%); }
		#pad-actions {
			display: flex;
			gap: 16px;
			pointer-events: none;
		}
		#pad-actions button {
			width: clamp(48px, 14vmin, 68px);
			height: clamp(48px, 14vmin, 68px);
			border-radius: 50%;
			border: 1px solid rgba(232, 236, 241, 0.25);
			background: rgba(13, 16, 21, 0.55);
			color: rgba(232, 236, 241, 0.85);
			font: 20px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
			pointer-events: auto;
			touch-action: none;
		}
		#pad-dpad.held,
		#pad-actions button.held {
			background: rgba(79, 163, 255, 0.3);
			border-color: rgba(79, 163, 255, 0.6);
		}
		.rig-edit {
			position: relative;
			width: 100%;
			height: 100%;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.6);
		}
		.rig-edit-hl, .rig-edit-ta {
			font: 12.5px/1.5 ui-monospace, Cascadia Code, Consolas, monospace;
			tab-size: 4;
			white-space: pre;
			word-wrap: normal;
			padding: 0.55rem 0.65rem;
			margin: 0;
			border: none;
		}
		.rig-edit-hl {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			color: #dbe2ea;
		}
		.rig-edit-ta {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			resize: none;
			background: transparent;
			color: transparent;
			caret-color: #e8ecf1;
			outline: none;
			overflow: auto;
		}
		.rig-edit-ta::selection { background: rgba(79, 163, 255, 0.28); }
		.rig-edit:focus-within { outline: 1px solid #4fa3ff; }
		.rig-edit-ro { opacity: 0.6; }
		.tk-k { color: #4fa3ff; }
		.tk-t { color: #4ec9b0; }
		.tk-b { color: #dcdcaa; }
		.tk-s { color: #ce9178; }
		.tk-n { color: #b5cea8; }
		.tk-c { color: #6a9955; font-style: italic; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="tui"></canvas>
		<canvas id="view" width="128" height="128"></canvas>
		<div id="code-host" hidden></div>
		<div class="host" id="host">
			<a class="brand" href="https://rig.works/">RigPlayer</a>
			<button type="button" id="host-open">Open</button>
			<button type="button" id="host-share">Share</button>
			<select id="host-examples" aria-label="Examples">
				<option value="">Examples</option>
				<option value="examples/jailbreak.rig">Jailbreak</option>
				<option value="examples/demo-3d.json">Demo 3D</option>
				<option value="examples/demo-gleditor.json">GLSL editor</option>
				<option value="examples/portable-tool.json">Portable tool</option>
				<option value="examples/ui-panel.json">LED panel</option>
				<option value="examples/wave-kid.json">Wave kid</option>
				<option value="examples/play-scene.json">Play scene</option>
			</select>
			<span class="spacer"></span>
			<a class="ghost" id="host-edit" href="?edit=1">Edit</a>
		</div>
		<div id="note" hidden></div>
		<div id="empty" hidden>
			<p>Drop a Rig document here</p>
			<p class="hint">pixel / Lua · scene / GLSL — Open or pick an example</p>
			<button type="button" id="empty-open">Open</button>
		</div>
		<div id="pad" hidden>
			<div id="pad-dpad" aria-label="d-pad">
				<span class="pad-arrow pad-up">&#9650;</span>
				<span class="pad-arrow pad-down">&#9660;</span>
				<span class="pad-arrow pad-left">&#9664;</span>
				<span class="pad-arrow pad-right">&#9654;</span>
			</div>
			<div id="pad-actions">
				<button id="pad-o" type="button" aria-label="O button">O</button>
				<button id="pad-x" type="button" aria-label="X button">X</button>
			</div>
		</div>
		<input id="file" type="file" accept=".json,.rig,.rigz,.atlas,.png,.jpg,.jpeg,.webp,application/json,application/zip" multiple />
		<div id="boot">Loading RigPlayer…</div>
	</div>
	<script src="./vendor/fengari-web.js"></script>
	<script type="module" src="./app.mjs"></script>
</body>
</html>
