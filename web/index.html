<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RigPlayer</title>
	<meta name="description" content="Full RigWorks host — ImTui chrome, pixel/Lua and scene/GLSL in the browser." />
	<script>
		(function () {
			var e = new URLSearchParams(location.search).get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
		})();
	</script>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: #0b0d10;
			color: #e8ecf1;
			font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
		}
		#app {
			position: relative;
			width: 100%;
			height: 100%;
		}
		canvas#tui {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 2;
			touch-action: none;
		}
		canvas#view {
			position: absolute;
			z-index: 3;
			display: block;
			background: #050608;
			touch-action: none;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}
		html.embed canvas#tui { display: none; }
		html.embed canvas#view {
			inset: 0;
			width: 100%;
			height: 100%;
		}
		#code-host {
			position: absolute;
			z-index: 3;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.92);
			border: 1px solid #2a313c;
		}
		#boot {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #0b0d10;
			z-index: 10;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			font-size: 12px;
			color: #888;
		}
		#boot[hidden] { display: none !important; }
		#boot.error {
			color: #f66;
			padding: 2rem;
			text-align: center;
			white-space: pre-wrap;
			text-transform: none;
			letter-spacing: 0;
		}
		input[type="file"] { display: none; }
		.rig-edit {
			position: relative;
			width: 100%;
			height: 100%;
			min-height: 0;
			overflow: hidden;
			background: rgba(13, 16, 21, 0.6);
		}
		.rig-edit-hl, .rig-edit-ta {
			font: 12.5px/1.5 ui-monospace, Cascadia Code, Consolas, monospace;
			tab-size: 4;
			white-space: pre;
			word-wrap: normal;
			padding: 0.55rem 0.65rem;
			margin: 0;
			border: none;
		}
		.rig-edit-hl {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			color: #dbe2ea;
		}
		.rig-edit-ta {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			resize: none;
			background: transparent;
			color: transparent;
			caret-color: #e8ecf1;
			outline: none;
			overflow: auto;
		}
		.rig-edit-ta::selection { background: rgba(79, 163, 255, 0.28); }
		.rig-edit:focus-within { outline: 1px solid #4fa3ff; }
		.rig-edit-ro { opacity: 0.6; }
		.tk-k { color: #4fa3ff; }
		.tk-t { color: #4ec9b0; }
		.tk-b { color: #dcdcaa; }
		.tk-s { color: #ce9178; }
		.tk-n { color: #b5cea8; }
		.tk-c { color: #6a9955; font-style: italic; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="tui"></canvas>
		<canvas id="view" width="128" height="128"></canvas>
		<div id="code-host" hidden></div>
		<input id="file" type="file" accept=".json,.rig,application/json" />
		<div id="boot">Loading RigPlayer…</div>
	</div>
	<script src="./vendor/fengari-web.js"></script>
	<script type="module" src="./app.mjs"></script>
</body>
</html>
