<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RigPlayer</title>
	<script>
		(function () {
			var e = new URLSearchParams(location.search).get("embed");
			if (e === "1" || e === "true") document.documentElement.classList.add("embed");
		})();
	</script>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0d10;
			--panel: #14181f;
			--text: #e8ecf1;
			--muted: #9aa3ad;
			--accent: #4fa3ff;
			--border: #2a313c;
		}
		* { box-sizing: border-box; }
		[hidden] { display: none !important; }
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			overscroll-behavior: none;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.4 system-ui, Segoe UI, sans-serif;
		}
		#app {
			display: grid;
			grid-template-rows: auto 1fr;
			width: 100%;
			height: 100%;
			min-width: 0;
			overflow: hidden;
		}
		html.embed #app { grid-template-rows: 1fr; }
		html.embed #app > header { display: none; }
		#app > header {
			display: flex;
			align-items: center;
			gap: 0.15rem;
			padding: 0.15rem 0.6rem;
			background: var(--panel);
			border-bottom: 1px solid var(--border);
			font-size: 13px;
			min-width: 0;
			max-width: 100%;
		}
		header h1 {
			display: flex;
			align-items: center;
			white-space: nowrap;
			flex: none;
			font-size: 13px;
			font-weight: 650;
			margin: 0 0.6rem 0 0;
			letter-spacing: 0.02em;
		}
		header h1::before {
			content: "";
			flex: none;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--accent);
			margin-right: 0.45rem;
		}
		header .meta {
			color: var(--muted);
			margin-left: auto;
			margin-right: 0.25rem;
			font-size: 12px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			min-width: 0;
		}
		details.menu { position: relative; }
		details.menu > summary {
			list-style: none;
			cursor: pointer;
			padding: 0.28rem 0.6rem;
			border-radius: 4px;
			user-select: none;
		}
		details.menu > summary::-webkit-details-marker { display: none; }
		details.menu > summary:hover, details.menu[open] > summary { background: #232b38; }
		.menu-items {
			position: absolute;
			top: calc(100% + 3px);
			left: 0;
			min-width: 200px;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.3rem;
			display: flex;
			flex-direction: column;
			z-index: 10;
			box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
		}
		.menu-item {
			appearance: none;
			display: block;
			width: 100%;
			text-align: left;
			background: none;
			border: none;
			color: var(--text);
			padding: 0.38rem 0.6rem;
			border-radius: 5px;
			cursor: pointer;
			font: inherit;
			font-size: 13px;
			text-decoration: none;
		}
		.menu-item:hover { background: #1d2c40; }
		.menu-item[aria-current="page"] { color: var(--accent); }
		.menu-sep { height: 1px; background: var(--border); margin: 0.25rem 0.2rem; }
		input[type="file"] { display: none; }
		#issues-toggle {
			appearance: none;
			background: none;
			border: 1px solid var(--border);
			border-radius: 4px;
			color: var(--muted);
			font: inherit;
			font-size: 11.5px;
			padding: 0.15rem 0.5rem;
			cursor: pointer;
			margin-right: 0.4rem;
		}
		#issues-toggle:hover { border-color: var(--accent); color: var(--text); }
		#issues-toggle[data-level="error"] { color: #f0b4b4; border-color: #5a2828; }
		#issues-toggle[data-level="warn"] { color: #f0d9a8; border-color: #5a4a28; }
		.rig-panel {
			background: rgba(16, 19, 25, 0.85);
			backdrop-filter: blur(8px);
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 0.25rem 0.35rem 0.35rem;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
			resize: both;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		.rig-panel-head {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-bottom: 0.25rem;
			cursor: grab;
			user-select: none;
			touch-action: none;
			font-size: 12px;
			flex-shrink: 0;
		}
		.rig-panel-head:active { cursor: grabbing; }
		.rig-panel-head > strong { margin-right: auto; font-weight: 600; }
		.rig-caret { color: var(--muted); font-size: 9px; transition: transform 0.12s ease; }
		.rig-panel.collapsed .rig-caret { transform: rotate(-90deg); }
		.rig-panel.collapsed .rig-panel-body { display: none; }
		.rig-panel.collapsed {
			resize: none;
			overflow: hidden;
			height: auto !important;
			min-height: 0;
			padding-bottom: 0.3rem;
		}
		.rig-panel.collapsed .rig-panel-head { margin-bottom: 0; }
		.rig-panel-role { color: var(--muted); font-size: 10.5px; margin-right: 0.2rem; }
		.rig-x {
			appearance: none;
			background: none;
			border: none;
			color: var(--muted);
			font-size: 14px;
			line-height: 1;
			padding: 0 0.15rem;
			cursor: pointer;
			order: 10;
		}
		.rig-x:hover { color: var(--text); }
		.rig-panel-body {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			flex: 1 1 auto;
			min-height: 0;
			overflow: auto;
		}
		#issues-panel {
			position: absolute;
			bottom: 42px;
			left: 10px;
			z-index: 6;
			width: min(420px, calc(100% - 20px));
			max-height: min(50%, calc(100% - 24px));
		}
		#panels {
			position: absolute;
			top: 12px;
			right: 12px;
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			max-width: calc(100% - 24px);
			max-height: calc(100% - 24px);
			overflow: auto;
			z-index: 2;
			pointer-events: none;
		}
		#panels:not([hidden]) { pointer-events: auto; }
		#panels.code-overlay {
			top: auto;
			left: 12px;
			right: auto;
			bottom: 12px;
			width: min(620px, calc(100% - 24px));
			max-height: 60%;
		}
		.rig-panel-role { order: 5; }
		.rig-buf-select {
			order: 6;
			background: #0d1015;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 4px;
			font: inherit;
			font-size: 11px;
			padding: 0.08rem 0.25rem;
			max-width: 140px;
		}
		.rig-buf-select:focus { outline: none; border-color: var(--accent); }
		.rig-group {
			border: 1px solid var(--border);
			border-radius: 5px;
			margin: 0;
			padding: 0.25rem 0.45rem 0.4rem;
		}
		.rig-group legend {
			padding: 0 0.25rem;
			color: var(--muted);
			font-size: 11px;
		}
		.rig-group-col { display: flex; flex-direction: column; gap: 0.4rem; }
		.rig-group-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
		.rig-ctrl {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 0.35rem 0.5rem;
			align-items: center;
		}
		.rig-ctrl-label { color: var(--text); font-size: 12px; grid-column: 1 / -1; }
		.rig-ctrl input[type="range"] { width: 140px; }
		.rig-ctrl-value { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.5rem; text-align: right; }
		.rig-panel input[type="range"], .rig-panel input[type="checkbox"] { accent-color: var(--accent); }
		.rig-panel input[type="color"] {
			appearance: none;
			width: 44px;
			height: 26px;
			padding: 2px;
			background: #0d1015;
			border: 1px solid var(--border);
			border-radius: 5px;
			cursor: pointer;
		}
		.rig-panel input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
		.rig-panel input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
		.rig-panel select, .rig-panel input[type="text"] {
			background: #0d1015;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 5px;
			padding: 0.25rem 0.45rem;
			font: inherit;
			font-size: 12.5px;
		}
		.rig-panel select:focus, .rig-panel input[type="text"]:focus {
			outline: none;
			border-color: var(--accent);
		}
		.rig-action {
			appearance: none;
			border: 1px solid var(--border);
			background: #1b212b;
			color: var(--text);
			padding: 0.22rem 0.6rem;
			border-radius: 4px;
			cursor: pointer;
			font: inherit;
			font-size: 12px;
			align-self: flex-start;
		}
		.rig-action:hover { border-color: var(--accent); }
		.rig-panel-code { max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
		.rig-panel-code .rig-panel-body { flex: 1; min-height: 0; }
		.rig-code-editor { display: flex; flex-direction: column; gap: 0.3rem; min-height: 0; flex: 1; }
		.rig-edit {
			position: relative;
			flex: 1;
			min-height: 280px;
			height: min(52vh, 520px);
			border: 1px solid var(--border);
			border-radius: 4px;
			background: rgba(13, 16, 21, 0.6);
			overflow: hidden;
		}
		.rig-edit-hl, .rig-edit-ta {
			font: 12.5px/1.5 ui-monospace, Cascadia Code, Consolas, monospace;
			tab-size: 4;
			white-space: pre;
			word-wrap: normal;
			padding: 0.55rem 0.65rem;
			margin: 0;
			border: none;
		}
		.rig-edit-hl {
			position: absolute;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			color: #dbe2ea;
		}
		.rig-edit-ta {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			resize: none;
			background: transparent;
			color: transparent;
			caret-color: var(--text);
			outline: none;
			overflow: auto;
		}
		.rig-edit-ta::selection { background: rgba(79, 163, 255, 0.28); }
		.rig-edit:focus-within { border-color: var(--accent); }
		.rig-edit-ro { opacity: 0.6; }
		.tk-k { color: var(--accent); }
		.tk-t { color: #4ec9b0; }
		.tk-b { color: #dcdcaa; }
		.tk-s { color: #ce9178; }
		.tk-n { color: #b5cea8; }
		.tk-c { color: #6a9955; font-style: italic; }
		.rig-issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
		.rig-issue {
			margin: 0;
			padding: 0.35rem 0.45rem;
			border-left: 2px solid var(--border);
			font-size: 12px;
			line-height: 1.35;
			color: var(--text);
		}
		.rig-issue[data-level="error"] { border-color: #c06060; background: rgba(80, 24, 24, 0.35); }
		.rig-issue[data-level="warn"] { border-color: #c0a050; background: rgba(70, 56, 16, 0.3); }
		.rig-issue[data-level="note"] { border-color: var(--border); color: var(--muted); }
		.rig-issue-code {
			display: inline-block;
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			color: var(--muted);
			margin-right: 0.35rem;
		}
		.rig-issue-hint { display: block; margin-top: 0.2rem; color: var(--muted); font-size: 11px; }
		#stage {
			position: relative;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			display: grid;
			place-items: center;
			background: #050608;
		}
		#stage.drag {
			outline: 2px dashed var(--accent);
			outline-offset: -8px;
		}
		canvas#view {
			width: min(100%, calc(100dvh - 2.5rem));
			height: min(100%, 100vw);
			max-width: 100%;
			max-height: 100%;
			aspect-ratio: 1;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			background: #000;
			touch-action: none;
		}
		#stage.mode-present { place-items: stretch; }
		#stage.mode-present canvas#view {
			width: 100%;
			height: 100%;
			max-width: none;
			max-height: none;
			aspect-ratio: auto;
			image-rendering: auto;
		}
		#stage.mode-present #controls-hint { display: none; }
		#share-banner {
			position: absolute;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 5;
			max-width: min(80%, 640px);
			align-items: center;
			gap: 0.6rem;
			padding: 0.35rem 0.7rem;
			font-size: 12.5px;
			border: 1px solid var(--border);
			border-radius: 6px;
			background: rgba(26, 34, 45, 0.85);
			backdrop-filter: blur(8px);
			box-shadow: 0 4px 14px rgba(0,0,0,0.3);
			color: var(--muted);
		}
		#share-banner:not([hidden]) { display: flex; }
		#share-banner span { flex: 1; min-width: 0; }
		.banner-close {
			appearance: none;
			background: none;
			border: none;
			color: inherit;
			font-size: 15px;
			line-height: 1;
			padding: 0 0.2rem;
			cursor: pointer;
			opacity: 0.7;
		}
		.banner-close:hover { opacity: 1; }
		#share-banner[data-level="soft"] { color: #f0d9a8; border-color: #5a4a28; background: rgba(42, 36, 20, 0.88); }
		#share-banner[data-level="hard"] { color: #f0b4b4; border-color: #5a2828; background: rgba(42, 20, 20, 0.88); }
		#empty {
			position: absolute;
			inset: 0;
			display: none;
			place-items: center;
			text-align: center;
			color: var(--muted);
			pointer-events: none;
			padding: 1.5rem;
		}
		#empty:not([hidden]) { display: grid; }
		#empty code { color: var(--text); }
		#overlay {
			position: absolute;
			left: 10px;
			bottom: 10px;
			right: 10px;
			max-height: 30%;
			overflow: auto;
			font-size: 12px;
			color: #f0d9a8;
			background: rgba(20, 16, 8, 0.85);
			border: 1px solid #5a4a28;
			border-radius: 6px;
			padding: 0.45rem 0.6rem;
			display: none;
			z-index: 4;
		}
		#controls-hint {
			position: absolute;
			right: 10px;
			bottom: 10px;
			font-size: 11px;
			color: var(--muted);
			background: rgba(16, 19, 25, 0.7);
			border: 1px solid var(--border);
			border-radius: 5px;
			padding: 0.25rem 0.45rem;
			z-index: 3;
			pointer-events: none;
		}
		@media (max-width: 640px) {
			#app > header {
				flex-wrap: wrap;
				row-gap: 0.1rem;
				padding: 0.2rem 0.4rem;
			}
			header .meta {
				order: 10;
				flex: 1 0 100%;
				margin: 0;
				font-size: 11px;
			}
			.menu-items {
				position: fixed;
				left: 8px;
				right: 8px;
				top: 2.75rem;
				min-width: 0;
				width: auto;
				max-height: min(70vh, 420px);
				overflow: auto;
				z-index: 50;
			}
			#controls-hint { display: none; }
		}
	</style>
</head>
<body>
	<div id="app">
		<header>
			<h1>RigPlayer</h1>
			<details class="menu" id="menu-file">
				<summary>File</summary>
				<div class="menu-items">
					<label class="menu-item">Open…<input id="file" type="file" accept=".json,.rig,application/json" /></label>
					<button type="button" class="menu-item" id="btn-copy-link" title="Copy a ?doc= link for small documents">Copy link</button>
					<button type="button" class="menu-item" id="btn-save-local" title="Save current document in this browser">Save local</button>
					<button type="button" class="menu-item" id="btn-restore-local" hidden title="Restore last local document">Restore local</button>
					<div class="menu-sep"></div>
					<a class="menu-item" id="download-single" href="rigplayer.html" title="Self-contained offline copy">Single-file HTML</a>
				</div>
			</details>
			<details class="menu" id="menu-examples">
				<summary>Examples</summary>
				<div class="menu-items">
					<a class="menu-item" href="?src=examples/jailbreak.rig">Jailbreak</a>
					<a class="menu-item" href="?src=examples/demo-3d.json">Demo 3D</a>
					<a class="menu-item" href="?src=examples/demo-gleditor.json">GLSL editor</a>
				</div>
			</details>
			<button type="button" id="issues-toggle" hidden title="Show validator issues"></button>
			<span class="meta" id="status">Drop a Rig document, or File → Open</span>
		</header>
		<div id="stage">
			<canvas id="view" width="128" height="128"></canvas>
			<div id="panels"></div>
			<div id="share-banner" hidden data-level=""></div>
			<div id="empty" hidden>
				<div>
					<p>Drop a Rig document (<code>.rig</code> / <code>.json</code>), or use <strong>File → Open</strong>.</p>
					<p>Full RigWorks host — pixel/Lua runtime and scene/GLSL present.</p>
				</div>
			</div>
			<section id="issues-panel" class="rig-panel" hidden>
				<header class="rig-panel-head" id="issues-head">
					<span class="rig-caret">▾</span>
					<strong>Issues</strong>
					<span class="rig-panel-role" id="issues-role">validator</span>
				</header>
				<div class="rig-panel-body">
					<ul class="rig-issues" id="issues-list"></ul>
				</div>
			</section>
			<div id="controls-hint">Arrows move · Z/C O · X/V X</div>
		</div>
	</div>
	<script src="./vendor/fengari-web.js"></script>
	<script type="module" src="./app.mjs"></script>
</body>
</html>
